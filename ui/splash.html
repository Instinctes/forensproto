<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForensProto – Start</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, #12203a 0%, #0a0f1c 60%, #060912 100%);
      color: #e8eefc;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; padding: 28px; text-align: center;
    }
    .logo { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
    .logo span { color: #4f9dff; }
    .status { font-size: 14px; color: #9fb2d6; max-width: 460px; line-height: 1.5; min-height: 42px; }
    .sub { font-size: 12px; color: #61729a; max-width: 460px; line-height: 1.45; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(79,157,255,0.25); border-top-color: #4f9dff;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bar { width: 340px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 30%; border-radius: 4px;
      background: linear-gradient(90deg, #2f6fd6, #4f9dff);
      animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Forens<span>Proto</span></div>
    <div class="spinner"></div>
    <div class="bar"><i></i></div>
    <div class="status" id="status">Starte ForensProto…</div>
    <div class="sub" id="sub"></div>
  </div>
  <script>
    // Reine, IPC-freie Anzeige: rotiert erklärende Hinweise, bis das native
    // Fenster (main) vom Rust-Backend eingeblendet und dieses Splash-Fenster
    // geschlossen wird. Bewusst ohne Tauri-JS-API, damit keine zusätzlichen
    // Berechtigungen/Angriffsfläche nötig sind und die Anzeige nie blockiert.
    const status = document.getElementById('status');
    const sub = document.getElementById('sub');
    const steps = [
      ["Prüfe Systemkomponenten…", "Hashcat, Ollama, Node.js und Python werden erkannt."],
      ["Ersteinrichtung läuft…", "Fehlende Komponenten werden im Hintergrund installiert. Dies ist nur beim ersten Start nötig."],
      ["Lade KI-Modell (llama3, ~4,7 GB)…", "Der Download läuft einmalig. Nicht-KI-Funktionen sind danach sofort nutzbar."],
      ["Starte lokalen Server…", "Der Forensik-Server wird lokal auf 127.0.0.1 hochgefahren."],
      ["Fast fertig…", "Das Anwendungsfenster öffnet sich automatisch, sobald alles bereit ist."]
    ];
    let i = 0;
    function tick() {
      status.textContent = steps[i][0];
      sub.textContent = steps[i][1];
      i = (i + 1) % steps.length;
    }
    tick();
    setInterval(tick, 4200);
  </script>
</body>
</html>
